<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Primary Meta Tags -->
    <title>Urban Drip - Premium Streetwear & Fashion</title>
    <meta name="title" content="Urban Drip - Premium Streetwear & Fashion" />
    <meta name="description" content="Shop premium streetwear at Urban Drip. Bold silhouettes, cinematic details, and culture-first design. Hoodies, tees, cargo pants, jackets and more. Fast delivery across Nigeria." />
    <meta name="keywords" content="streetwear, urban fashion, hoodies, t-shirts, cargo pants, jackets, Nigerian fashion, Urban Drip, premium clothing" />
    <meta name="author" content="Urban Drip" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://urbandrip-app.vercel.app/" />
    <meta property="og:title" content="Urban Drip - Premium Streetwear & Fashion" />
    <meta property="og:description" content="Shop premium streetwear at Urban Drip. Bold silhouettes, cinematic details, and culture-first design." />
    <meta property="og:image" content="https://urbandrip-app.vercel.app/og-image.png" />
    <meta property="og:site_name" content="Urban Drip" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://urbandrip-app.vercel.app/" />
    <meta name="twitter:title" content="Urban Drip - Premium Streetwear & Fashion" />
    <meta name="twitter:description" content="Shop premium streetwear at Urban Drip. Bold silhouettes, cinematic details, and culture-first design." />
    <meta name="twitter:image" content="https://urbandrip-app.vercel.app/og-image.png" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Clash+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Urban Drip",
      "url": "https://urbandrip-app.vercel.app",
      "logo": "https://urbandrip-app.vercel.app/vite.svg",
      "description": "Premium streetwear brand. Bold silhouettes, cinematic details, and culture-first design.",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "support@urbandrip.com",
        "telephone": "+234 800 000 0000"
      }
    }
    </script>

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Urban Drip",
      "url": "https://urbandrip-app.vercel.app"
    }
    </script>

    <!-- Structured Data: OnlineStore -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "name": "Urban Drip",
      "url": "https://urbandrip-app.vercel.app",
      "description": "Premium streetwear store. Hoodies, tees, cargo pants, jackets and more.",
      "priceRange": "₦5,000 - ₦50,000"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
